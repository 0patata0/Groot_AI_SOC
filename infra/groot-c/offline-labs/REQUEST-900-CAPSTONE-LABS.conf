# Install in WAF /etc/modsecurity.d/owasp-crs/rules/ before CRS phase-1 checks.
# Root-owned host source: /etc/capstone-offline-labs-waf/REQUEST-900-CAPSTONE-LABS.conf.
# Installed by scripts/apply-waf.py; reapply after an approved full recreation.
# IDs 10030-10032 were absent from 677 installed IDs on 2026-10-22.
# Only the dedicated TLS gateway can reach this WAF host/path location.
# Keep global DetectionOnly, all CRS rules and all audit settings unchanged.
# Nginx selects the only proxied path after URI normalization. Scope these
# rules to its exact virtual host: REQUEST_URI retains dot segments and repeated
# slashes, so repeating the path check here would leave aliases in DetectionOnly.

SecRule REQUEST_HEADERS:Host "@streq log4shell.grootlab.duckdns.org" \
    "id:10030,phase:1,pass,nolog,t:none,ctl:ruleEngine=On,setvar:tx.capstone_lab_mode=enforce"

SecRule REQUEST_HEADERS:Host "@streq log4shell.grootlab.duckdns.org" \
    "id:10031,phase:1,pass,nolog,t:none,chain"
    SecRule REQUEST_HEADERS:X-Capstone-Lab-Mode "@streq exempt" \
        "t:none,ctl:ruleEngine=DetectionOnly,setvar:tx.capstone_lab_mode=exempt"

# Harmless synthetic policy check: anonymous=enforced 403, valid exemption=200
# from the normal Java status API. Both cases retain an audit event. This is not
# an exploit, vulnerability proof, or a real attack-detection validation.
SecRule REQUEST_HEADERS:Host "@streq log4shell.grootlab.duckdns.org" \
    "id:10032,phase:2,deny,status:403,log,auditlog,t:none,severity:NOTICE,msg:'Capstone lab policy canary (synthetic)',tag:'capstone/lab-policy-test',logdata:'mode=%{tx.capstone_lab_mode} request=%{REQUEST_HEADERS.X-Capstone-Lab-Request}',chain"
    SecRule REQUEST_HEADERS:X-Groot-Lab-Check "@streq mode-check-v1" "t:none"
