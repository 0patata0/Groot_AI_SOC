# Groot_A — 이름 기반 리버스 프록시 (A:443). 채팅·관리포털·Log4Shell을 Host(SNI)로 분기.
#   https://chat.groot.lab  → B(10.200.10.10):8065  Mattermost (웹소켓)
#   https://wazuh.groot.lab → B(10.200.10.10):443   Wazuh 대시보드 (HTTPS 백엔드) — 출발지 제한(VPN 거부)
#   + 팀원 무설정 이름(공개 DNS, DuckDNS): chat.grootlab.duckdns.org / wazuh.grootlab.duckdns.org — hosts 없이 학과망·VPN 어디서나 해석.
#     별도 server 블록·별도 인증서(tls/chatduck.*, tls/wazuhduck.*) → 기존 groot.lab 사용자(인증서 신뢰)에 영향 없음. (2026-09-28)
# 목적: VPN(443만 통과)·캠퍼스·학과망 어디서나 동일 URL, 루프백/터널 불필요.
#       학과망(192.168.12.x)은 A:10443 이 캠퍼스 방화벽에 막혀(실측 2026-09-28) 이 경로가 대시보드의 유일한 경로.
# 보안: Host 가 등록된 이름일 때만 응답, 맨 IP/다른 Host 는 444(무응답). 대시보드는 학과망·VM세그먼트·내부망만 허용,
#       2026-10-26: 학과망 211.170.162.0/24 관리 접근 추가. VPN(192.168.15.0/24)·그 외 출발지는403.
worker_processes auto;
events { worker_connections 1024; }
http {
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    # 맨 IP·다른 Host·SNI 불일치 → 아무 응답 없이 종료
    server {
        listen 8443 ssl default_server;
        ssl_certificate     /etc/nginx/tls/chat.crt;
        ssl_certificate_key /etc/nginx/tls/chat.key;
        return 444;
    }

    # ── 채팅 (Mattermost) ──────────────────────────────────────────────────────
    server {
        listen 8443 ssl;
        server_name chat.groot.lab;
        ssl_certificate     /etc/nginx/tls/chat.crt;
        ssl_certificate_key /etc/nginx/tls/chat.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 110M;              # Mattermost 기본 MaxFileSize(100M) + 여유(멀티파트 오버헤드)
        proxy_read_timeout 600s; proxy_send_timeout 600s;

        location / {
            proxy_pass https://10.200.10.10:8444;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/nginx/tls/capstone-siem-ca.crt;
            proxy_ssl_server_name on;
            proxy_ssl_name capstone-siem.internal;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;          # 웹소켓 업그레이드
            proxy_set_header Connection $connection_upgrade;
        }
    }

    # ── 관리포털 (Wazuh 대시보드) ─────────────────────────────────────────────
    # 인증서는 채팅과 분리(tls/wazuh.*) → 채팅 인증서/데스크톱 앱 재신뢰 불필요.
    # 출발지 allowlist: A 는 클라이언트 IP 를 NAT 없이 그대로 본다(실측: 학과망 PC=192.168.12.x).
    server {
        listen 8443 ssl;
        server_name wazuh.groot.lab;
        ssl_certificate     /etc/nginx/tls/wazuh.crt;
        ssl_certificate_key /etc/nginx/tls/wazuh.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        allow 192.168.16.231; # named administrator only
        deny all;

        large_client_header_buffers 4 32k;   # 대시보드 쿠키/헤더가 큼
        proxy_buffer_size 32k; proxy_buffers 8 32k; proxy_busy_buffers_size 64k;
        proxy_read_timeout 300s; proxy_send_timeout 300s;
        client_max_body_size 20M;

        location / {
            proxy_pass https://10.200.10.10:443;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/nginx/tls/capstone-siem-ca.crt;
            proxy_ssl_name wazuh.dashboard;
            proxy_ssl_server_name on;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # ── 팀원 무설정 접근: DuckDNS 이름 (grootlab.duckdns.org → 192.168.16.230, 공개 DNS 가 답) ───────────
    server {
        listen 8443 ssl;
        server_name chat.grootlab.duckdns.org;
        ssl_certificate     /etc/nginx/tls/chatduck.crt;
        ssl_certificate_key /etc/nginx/tls/chatduck.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 110M;
        proxy_read_timeout 600s; proxy_send_timeout 600s;
        location / {
            proxy_pass https://10.200.10.10:8444;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/nginx/tls/capstone-siem-ca.crt;
            proxy_ssl_server_name on;
            proxy_ssl_name capstone-siem.internal;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
    server {
        listen 8443 ssl;
        server_name wazuh.grootlab.duckdns.org;
        ssl_certificate     /etc/nginx/tls/wazuhduck.crt;
        ssl_certificate_key /etc/nginx/tls/wazuhduck.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        allow 192.168.16.231; # named administrator only
        deny all;
        large_client_header_buffers 4 32k;
        proxy_buffer_size 32k; proxy_buffers 8 32k; proxy_busy_buffers_size 64k;
        proxy_read_timeout 300s; proxy_send_timeout 300s;
        client_max_body_size 20M;
        location / {
            proxy_pass https://10.200.10.10:443;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/nginx/tls/capstone-siem-ca.crt;
            proxy_ssl_name wazuh.dashboard;
            proxy_ssl_server_name on;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
    # Log4Shell의 기본 실습 주소는 HTTP 80이다. HTTPS 선택 접속도 지원한다.
    # chatduck 인증서는 chat/log4shell 두 이름을 포함하는 공인 와일드카드여야 한다.
    # C로 직접 우회하지 않고 기존 A:80 WAF를 거쳐 같은 UI에 연결한다.
    server {
        listen 8443 ssl;
        server_name log4shell.grootlab.duckdns.org;
        absolute_redirect off;
        ssl_certificate /etc/nginx/tls/chatduck.crt;
        ssl_certificate_key /etc/nginx/tls/chatduck.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        # Lab web access is public; administrative/session checks stay below.
        # Fresh deployments replace this ACL with explicit LAB_ALLOWED_CIDRS.
        allow all;
        deny all;
        client_max_body_size 4k;
        proxy_read_timeout 75s;
        proxy_send_timeout 15s;
        add_header Strict-Transport-Security "max-age=86400" always;

        # Shared local theme assets cover the console and every lab HTML page.
        # Only text/html is filtered; API responses and lab input stay untouched.
        sub_filter '</head>' '<link rel="stylesheet" href="/log4shell/static/theme.css"><script src="/log4shell/static/theme.js" defer></script></head>';
        sub_filter_once on;

        # A browser cannot invoke the trusted gateway-check endpoint directly.
        location = /log4shell/api/gateway-session { return 404; }

        location = /_capstone_lab_session {
            internal;
            proxy_pass http://10.200.10.20:80/_offline-labs/api/gateway-session;
            proxy_pass_request_body off;
            proxy_pass_request_headers off;
            proxy_set_header Content-Length "";
            proxy_set_header Host log4shell.grootlab.duckdns.org;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Lab-Gateway "1";
            proxy_set_header X-Lab-Id $capstone_selected_lab;
            proxy_set_header X-Lab-Client-IP $remote_addr;
            proxy_set_header X-Lab-Request-ID $request_id;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location = /log4shell/labs/CVE-2021-44228 {
            return 308 /log4shell/labs/CVE-2021-44228/;
        }

        location ^~ /log4shell/labs/CVE-2021-44228/ {
            set $capstone_selected_lab "CVE-2021-44228";
            # The checker only filters the lab cookie. WAF enforcement is fixed
            # for every request, including authenticated administrators.
            auth_request /_capstone_lab_session;
            auth_request_set $capstone_lab_java_cookie $upstream_http_x_lab_cookie;
            client_max_body_size 8k;
            proxy_pass http://172.18.0.2:8080;
            proxy_http_version 1.1;
            proxy_set_header Accept-Encoding "";
            proxy_set_header Host log4shell.grootlab.duckdns.org;
            proxy_set_header Authorization "";
            proxy_set_header Proxy "";
            proxy_set_header Cookie $capstone_lab_java_cookie;
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Groot-Lab-TLS "";
            proxy_set_header X-Lab-Gateway "";
            proxy_set_header X-Lab-Client-IP "";
            proxy_set_header X-Lab-Request-ID "";
            proxy_set_header X-Capstone-Lab-Mode enforce;
            # Preserve the original port as well: real_ip with a bare address
            # yields port zero, which the existing evidence validator rejects.
            proxy_set_header X-Capstone-Lab-Client "$remote_addr:$remote_port";
            proxy_set_header X-Capstone-Lab-Request $request_id;
            proxy_set_header Connection "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 20s;
        }

        location = /log4shell/labs/CVE-2021-41773 {
            return 308 /log4shell/labs/CVE-2021-41773/;
        }

        location ^~ /log4shell/labs/CVE-2021-41773/ {
            set $capstone_selected_lab "CVE-2021-41773";
            # The checker only filters the lab cookie. WAF enforcement is fixed
            # for every request, including authenticated administrators.
            auth_request /_capstone_lab_session;
            auth_request_set $capstone_lab_java_cookie $upstream_http_x_lab_cookie;
            client_max_body_size 8k;
            # Keep the static lab policy, allowing only our local theme script.
            proxy_hide_header Content-Security-Policy;
            add_header Content-Security-Policy "default-src 'none'; script-src https://log4shell.grootlab.duckdns.org/log4shell/static/theme.js; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
            add_header Strict-Transport-Security "max-age=86400" always;
            proxy_pass http://172.18.0.2:8080;
            proxy_http_version 1.1;
            proxy_set_header Accept-Encoding "";
            proxy_set_header Host log4shell.grootlab.duckdns.org;
            proxy_set_header Authorization "";
            proxy_set_header Proxy "";
            proxy_set_header Cookie $capstone_lab_java_cookie;
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Groot-Lab-TLS "";
            proxy_set_header X-Lab-Gateway "";
            proxy_set_header X-Lab-Client-IP "";
            proxy_set_header X-Lab-Request-ID "";
            proxy_set_header X-Capstone-Lab-Mode enforce;
            # Preserve the original port as well: real_ip with a bare address
            # yields port zero, which the existing evidence validator rejects.
            proxy_set_header X-Capstone-Lab-Client "$remote_addr:$remote_port";
            proxy_set_header X-Capstone-Lab-Request $request_id;
            proxy_set_header Connection "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 20s;
        }

        location = /log4shell/labs/CVE-2021-42013 {
            return 308 /log4shell/labs/CVE-2021-42013/;
        }

        location ^~ /log4shell/labs/CVE-2021-42013/ {
            set $capstone_selected_lab "CVE-2021-42013";
            # The checker only filters the lab cookie. WAF enforcement is fixed
            # for every request, including authenticated administrators.
            auth_request /_capstone_lab_session;
            auth_request_set $capstone_lab_java_cookie $upstream_http_x_lab_cookie;
            client_max_body_size 8k;
            # Keep the static lab policy, allowing only our local theme script.
            proxy_hide_header Content-Security-Policy;
            add_header Content-Security-Policy "default-src 'none'; script-src https://log4shell.grootlab.duckdns.org/log4shell/static/theme.js; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
            add_header Strict-Transport-Security "max-age=86400" always;
            proxy_pass http://172.18.0.2:8080;
            proxy_http_version 1.1;
            proxy_set_header Accept-Encoding "";
            proxy_set_header Host log4shell.grootlab.duckdns.org;
            proxy_set_header Authorization "";
            proxy_set_header Proxy "";
            proxy_set_header Cookie $capstone_lab_java_cookie;
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Groot-Lab-TLS "";
            proxy_set_header X-Lab-Gateway "";
            proxy_set_header X-Lab-Client-IP "";
            proxy_set_header X-Lab-Request-ID "";
            proxy_set_header X-Capstone-Lab-Mode enforce;
            # Preserve the original port as well: real_ip with a bare address
            # yields port zero, which the existing evidence validator rejects.
            proxy_set_header X-Capstone-Lab-Client "$remote_addr:$remote_port";
            proxy_set_header X-Capstone-Lab-Request $request_id;
            proxy_set_header Connection "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 20s;
        }

        location ^~ /log4shell/labs/ { return 404; }

        location /log4shell/ {
            proxy_read_timeout 275s;
            client_max_body_size 8k;
            proxy_pass http://172.18.0.2:8080;
            proxy_http_version 1.1;
            proxy_set_header Accept-Encoding "";
            proxy_set_header Host log4shell.grootlab.duckdns.org;
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Groot-Lab-TLS "";
            proxy_set_header X-Lab-Gateway "";
            proxy_set_header X-Lab-Client-IP "";
            proxy_set_header X-Lab-Request-ID "";
            proxy_set_header X-Capstone-Lab-Mode enforce;
            proxy_set_header X-Capstone-Lab-Client "$remote_addr:$remote_port";
            proxy_set_header X-Capstone-Lab-Request $request_id;
        }
        # Root icon requests must return an image, never the console HTML.
        location = /favicon.ico { rewrite ^ /log4shell/static/favicon.ico last; }
        location = /favicon.png { rewrite ^ /log4shell/static/favicon.png last; }
        location = /favicon.svg { rewrite ^ /log4shell/static/favicon.svg last; }
        location = /apple-touch-icon.png { rewrite ^ /log4shell/static/apple-touch-icon.png last; }
        location = /apple-touch-icon-precomposed.png { rewrite ^ /log4shell/static/apple-touch-icon.png last; }
        location / { return 302 /log4shell/; }
    }
}
