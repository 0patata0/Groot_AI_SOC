# Bounded synthetic batch proof. Not an event-time window or durable aggregate.
data_dir = "${CAPSTONE_AUDIT_DATA}"
[sources.synthetic]
type = "stdin"
decoding.codec = "json"
[transforms.current_time_gate]
type = "remap"
inputs = ["synthetic"]
file = "freshness.vrl"
drop_on_error = true
[transforms.eligible_here]
type = "filter"
inputs = ["current_time_gate"]
condition = '.audit.allowed_at_this_transform == true'
[transforms.batch_fields]
type = "remap"
inputs = ["eligible_here"]
source = '''
. = {"group": .capstone_norm.source, "unique_ids": [string!(.capstone_norm.correlation_dedupe_key)], "input_count": 1}
'''
[transforms.unique_batch]
type = "reduce"
inputs = ["batch_fields"]
group_by = ["group"]
max_events = 5
expire_after_ms = 60000
end_every_period_ms = 60000
merge_strategies.unique_ids = "flat_unique"
merge_strategies.input_count = "sum"
[transforms.summary]
type = "remap"
inputs = ["unique_batch"]
source = '''
.unique_count = length(array!(.unique_ids))
.operational_promotion_authorized = false
'''
[sinks.synthetic_stdout]
type = "console"
inputs = ["summary"]
target = "stdout"
encoding.codec = "json"
