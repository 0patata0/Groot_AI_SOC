[[tests]]
name = "nft_kernel_cursor_KST"
[[tests.inputs]]
insert_at = "nft_normalize"
type = "vrl"
source = '''
. = {"_TRANSPORT": "kernel", "__REALTIME_TIMESTAMP": "1791889200000000", "__CURSOR": "s=test;i=42;b=test;m=1;t=2;x=3", "message": "FW_DROP_IN IN=ens192 OUT= SRC=192.0.2.40 DST=198.51.100.20 PROTO=TCP SPT=42000 DPT=443"}
'''
[[tests.outputs]]
extract_from = "nft_normalize"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
assert_eq!(.capstone_norm.event_time_kst, "2026-10-13T20:00:00.000000+09:00")
assert_eq!(.capstone_norm.source, "nftables")
assert_eq!(.capstone_norm.action, "logged_drop")
assert_eq!(.capstone_norm.source_ip, "192.0.2.40")
assert_eq!(.capstone_norm.destination_port, 443)
assert_eq!(.capstone_norm.identity_scope, "journal_cursor")
assert!(!exists(.message) && !exists(.__CURSOR))
'''

