# Root-managed v2 format. The audit ID carries server context-creation time.
log_format capstone_waf_evidence escape=json
  '{"capstone_waf_access_version":"2",'
  '"deployment_binding":"3ae6308be37c1ab82ce62720e2b516c4c27190a9e043afe913b76bdf1da10637",'
  '"request_id":"$request_id",'
  '"time_iso8601":"$time_iso8601","msec":"$msec",'
  '"request_time":"$request_time",'
  '"source_ip":"$remote_addr","destination_ip":"$server_addr",'
  '"source_port":"$remote_port","destination_port":"$server_port",'
  '"http_method":"$request_method","http_status":"$status"}';
access_log /var/log/modsecurity/capstone-access.log capstone_waf_evidence;
modsecurity_transaction_id "v2:3ae6308be37c1ab82ce62720e2b516c4c27190a9e043afe913b76bdf1da10637:$request_id:$msec:$time_iso8601";
