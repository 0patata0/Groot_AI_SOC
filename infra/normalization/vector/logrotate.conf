# Invoked only by the fixed maintenance wrapper; never global logrotate.
/var/log/capstone-vector/ready/normalized.jsonl
/var/log/capstone-vector/quarantine/quarantine.jsonl
/var/log/capstone-vector/evidence/normalized.jsonl
/var/log/capstone-vector/telemetry/health.jsonl {
    daily
    maxsize 64M
    rotate 48
    maxage 14
    missingok
    notifempty
    compress
    delaycompress
    dateext
    dateformat -%Y%m%d-%H%M%S
    create 0600 root root
    nocopytruncate
    sharedscripts
    firstaction
        /usr/local/sbin/capstone-vector-maintenance prepare
    endscript
    lastaction
        /usr/local/sbin/capstone-vector-maintenance finish
    endscript
}
