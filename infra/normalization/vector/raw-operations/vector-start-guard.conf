[Unit]
After=docker.service
StartLimitIntervalSec=120s
StartLimitBurst=10

[Service]
# Only this fixed, read-only guard bypasses the main process capability sandbox.
ExecStartPre=+/bin/bash /usr/local/lib/capstone-raw-operations/guard.sh vector
TimeoutStartSec=150s
Restart=on-failure
RestartSec=30s
