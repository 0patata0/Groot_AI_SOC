[[tests]]
name = "collection_counter_excludes_private_tags"
[[tests.inputs]]
insert_at = "collection_health_metadata"
type = "vrl"
source = '''. = {"timestamp":"2026-10-14T04:00:00+09:00","name":"component_errors_total","counter":{"value":2.0},"tags":{"component_id":"waf_audit","vector_pid":"123","error_code":"reading_line_from_file","file":"/private/input","reason":"private-payload"},"raw":"private-payload"}'''
[[tests.outputs]]
extract_from = "collection_health_metadata"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
assert_eq!(.capstone_collection_health.value, 2.0)
assert_eq!(.capstone_collection_health.labels, {"error_code":"reading_line_from_file"})
assert_eq!(length(keys(.)), 1)
assert!(!contains(encode_json(.), "private"))
assert!(ends_with(string!(.capstone_collection_health.observed_at_kst), "+09:00"))
'''

