# FW 전체 읽기: 기존 resp MCP/get_firewall_rules 사용. 신규 설정 키·포트·권한 없음.
# Data only: no quotes, variable expansion, command substitution, or shell code.
# Copy to deployment/site.local.conf (Git-ignored), then change every address.
SECURITY_HOST=192.0.2.10
SIEM_HOST=192.0.2.20
SERVICE_HOST=192.0.2.30
SSH_USER=ubuntu
SSH_PORT=22
# security(A) 초기 설치는 SHA1/UMAC64 계열 MAC 4종을 제외합니다.
# 고정 정책: deployment/ssh_macs.py. 기존의 더 엄격한 정책과 충돌하면 중단합니다.
# 계정·키·허용 IP 정책은 별도이며 이 설정만으로 전체 CIS/SCA 통과를 뜻하지 않습니다.
# 위 공통 포트는 진단용 A/C snapshot reader에도 적용됩니다.
# 진단 전용 키·host key pin·root collector·비권한 MCP 읽기 경로는 자동 구성합니다.
# 독립 감시: A→B/C 고정 reader 전용 키와 기존 HTTPS Mattermost 웹훅을 자동 연결합니다.
# A 장애 outbox·B 모델/합성 수집 검사 timer3개. 추가 패키지·포트·사용자 비밀 설정은 없습니다.
# 외부 즉시 알림은 없으며 B/Mattermost 복구 뒤 재전송합니다. infra/mcp/monitoring.md 참조.
# Empty uses existing ssh-agent/default keys. Use an absolute path when specified.
SSH_IDENTITY=
# This must contain host keys verified independently through the server console.
SSH_KNOWN_HOSTS=/home/operator/.ssh/known_hosts
MONITOR_INTERFACE=auto
WEB_BACKEND_PORT=80
WAF_PORT=8080
# Prepare DNS/hosts -> SECURITY_HOST and a certificate valid for this hostname.
LAB_PUBLIC_ORIGIN=https://lab.example.org
LAB_HTTPS_PORT=443
# Only these internal/VPN source networks can access the lab TLS endpoint.
# 모든 출발지의 실습 웹 접근을 허용하려면 명시적으로 all 지정.
# 관리 SSH/Wazuh/MCP 및 실습 관리 인증 권한과 별개다.
LAB_ALLOWED_CIDRS=192.168.10.0/24
# Dedicated, unused Docker /29. Must not overlap host routes or allowed clients.
LAB_PROXY_SUBNET=172.30.247.0/29
LAB_GATEWAY_PORT=18091
# Paths below are on target servers, never uploaded from the controller.
# Service server:
LAB_WHEEL_DIR=/opt/capstone-prereqs/wheels
LAB_MANIFEST=/opt/capstone-prereqs/cve_list.json
# Existing signed rootless sudo bundle; shared web terminal uses a fixed adapter.
LAB_SUDO_BUNDLE=/opt/capstone-prereqs/sudo
# Separate manifest/provenance + Redis/Samba image archives; no runtime downloads.
LAB_NONWEB_BUNDLE=/opt/capstone-prereqs/nonweb
# Security server (root-owned; key mode0600):
LAB_TLS_CERT=/opt/capstone-prereqs/lab-tls.crt
LAB_TLS_KEY=/opt/capstone-prereqs/lab-tls.key
# Lab exemption key is streamed from SIEM siem.json indexer_password (admin).
# No LAB_ADMIN_KEY setting/value belongs in this file.
LLM_BASE_URL=http://192.0.2.40:11434/v1
LLM_MODEL=qwen3.6:35b
# Optional administrator-owned SSH inference transport; empty keeps direct API.
# Prepare restricted remote public-key access and a B-local root0600 config/key.
# Set LLM_BASE_URL=http://<SIEM_HOST>:11435/v1 when enabled.
# Add the external inference address to LOG_PROTECTED_IPS and permit ONLY
# SIEM -> inference SSH destination/port at the site's egress gateway.
# See inference-transport.md. No model/key/password is downloaded by deploy.sh.
LLM_TUNNEL_CONFIG=
# Optional SOC comparison runtime on the SAME SIEM host (no new NIC/daemon).
# Requires reviewed deb/wheel bundle; keeps the existing Hermes runtime.
OLLAMA_TRIAL_ENABLE=0
# hermes-parity: same 27 read + 9 approval/evidence-gated tools as Hermes.
OLLAMA_TRIAL_ACCESS_MODE=read-only
# Optional bot @ollama + private soc-ollama channel (runtime flag must be 1).
# Adds a nonprivileged service; names the existing Hermes channel soc-hermes.
# 일반 채팅의 순수 읽기 MCP 연결은 요청 시 생성하고 유휴 300초 뒤 종료한다.
# 쓰기/혼합 resp·공동채널 일회성 worker는 기존 연결 경로를 유지한다.
# SSH 설정·키를 교체하면 capstone-ollama-chat.service를 재시작해 기존 연결을 닫는다.
OLLAMA_TRIAL_CHAT_ENABLE=0
# Optional shared channel: explicit @hermes/@ollama and conditional peer review.
# Requires OLLAMA_TRIAL_CHAT_ENABLE=1; no extra package, image or listening port.
SOC_REVIEW_CHAT_ENABLE=0
OLLAMA_TRIAL_BUNDLE=/opt/capstone-prereqs/ollama-trial
# Extra protected IPv4 literals (comma separated), never CIDRs or hostnames.
# The three servers and a literal LLM address are always protected as well.
# If LLM_BASE_URL uses a hostname, list every approved LLM address explicitly.
# Include management/VPN endpoints that must never be selected for containment.
LOG_PROTECTED_IPS=
# Optional administrator IP/CIDR exemptions from SOC IP blocking. Empty skips.
# Accepts one IPv4 or multiple comma-separated IPv4/CIDR ranges; IP becomes /32.
# Example: 192.168.10.25,192.168.15.0/24
# These are block exceptions, not lab HTTPS access CIDRs or log exclusions.
# Current campus policy; replace with the new site's administrator networks.
ADMIN_PROTECTED_CIDRS=211.170.162.0/24
# SSH sources and web clients are separate from IP-block protection exceptions.
MANAGEMENT_ALLOWED_CIDRS=192.168.10.0/24,192.168.12.0/24,211.170.162.0/24
# Explicit SIEM frontend clients. SSH/block exemptions do not grant web access.
DASHBOARD_ALLOWED_CIDRS=192.168.10.0/24,192.168.12.0/24,192.168.16.0/24,211.170.162.0/24
DASHBOARD_DENIED_CIDRS=192.168.15.0/24
CHAT_ALLOWED_CIDRS=192.168.10.0/24,192.168.12.0/24,192.168.15.0/24,192.168.16.0/24
# Each host also requires /opt/capstone-prereqs/artifacts.json.
# It lists reviewed local .deb archives and docker-save .tar images; deploy.sh
# installs/loads them automatically, without downloads. Empty arrays mean that
# dependencies are already installed; role checks still enforce their versions.
# LOG4SHELL_IMAGE / LOG4SHELL_APP_JAR / LOG4SHELL_HOSTNAME are retired.
# Optional image overrides for already prepared artifacts:
# WAF_IMAGE=owasp/modsecurity-crs:nginx
# SURICATA_IMAGE=jasonish/suricata:8.0.6
# DVWA_IMAGE=ghcr.io/digininja/dvwa:latest
# MARIADB_IMAGE=mariadb:10
