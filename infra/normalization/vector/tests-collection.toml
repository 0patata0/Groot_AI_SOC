[[tests]]
name = "collection_heartbeat_invocation_bound"
[[tests.inputs]]
insert_at = "collection_health_metadata"
type = "vrl"
source = '''. = {"timestamp":"2026-10-14T04:00:00+09:00","name":"uptime_seconds","gauge":{"value":12.0},"tags":{"vector_pid":"789"}}'''
[[tests.outputs]]
extract_from = "collection_health_metadata"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
assert_eq!(.capstone_collection_health.component, "vector")
assert_eq!(.capstone_collection_health.metric, "uptime_seconds")
assert!(match(string!(.capstone_collection_health.invocation_id), r'^[a-f0-9]{32}$'))
'''

