# Native Vector tests. Execute with vector.toml; no source reading or sink writes.

[[tests]]
name = "suricata_KST_and_no_raw"
[[tests.inputs]]
insert_at = "suricata_normalize"
type = "vrl"
source = '''
. = {"message": "{\"timestamp\":\"2026-10-13T11:00:00.123456+00:00\",\"event_type\":\"alert\",\"src_ip\":\"192.0.2.40\",\"src_port\":42000,\"dest_ip\":\"198.51.100.20\",\"dest_port\":443,\"proto\":\"TCP\",\"alert\":{\"signature_id\":1000999,\"severity\":2,\"action\":\"allowed\"},\"http\":{\"http_method\":\"GET\",\"status\":403},\"payload\":\"MUST_NOT_LEAK\",\"http_private\":\"MUST_NOT_LEAK\"}"}
'''
[[tests.outputs]]
extract_from = "suricata_normalize"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
assert_eq!(.capstone_norm.schema_version, "vector-1")
assert_eq!(.capstone_norm.pipeline, "vector")
assert_eq!(.capstone_norm.event_time_kst, "2026-10-13T20:00:00.123456+09:00")
assert_eq!(.capstone_norm.rule_ids, ["1000999"])
assert_eq!(.capstone_norm.source_ip, "192.0.2.40")
assert_eq!(.capstone_norm.destination_port, 443)
assert_eq!(.capstone_norm.action, "allowed")
assert_eq!(.capstone_norm.http_status, 403)
assert!(!exists(.message) && !exists(.payload) && !exists(.capstone_norm.payload))
assert_eq!(length(string!(.capstone_norm.message_sha256)), 64)
assert!(!contains(encode_json(.), "MUST_NOT_LEAK"))
'''

