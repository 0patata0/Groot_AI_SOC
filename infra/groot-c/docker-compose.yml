# capstone_Groot_C — 메인 웹서버 (공격 대상)
# DVWA + DB + CVE(Log4Shell) 취약 컨테이너
# 주의: 격리 실험 환경 전용. 이미지 태그는 구축 시 확인 후 고정할 것.

services:
  dvwa:
    # TODO: 태그 고정 (예: ghcr.io/digininja/dvwa:latest → 특정 sha)
    image: ghcr.io/digininja/dvwa:latest
    container_name: dvwa
    restart: unless-stopped
    environment:
      # DVWA 보안 수준은 실험 시 low/medium 등으로 조절
      - DB_SERVER=db
    ports:
      - "80:80"            # WAF(Groot_A)가 이 포트로 프록시
    volumes:
      - ./logs/apache:/var/log/apache2   # 웹 로그를 호스트로 → Wazuh Agent 수집
    depends_on:
      - db
    networks: [web]

  db:
    # TODO: 태그 고정
    image: mariadb:10.11
    container_name: dvwa-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PW}      # .env로 분리
      - MYSQL_DATABASE=dvwa
      - MYSQL_USER=dvwa
      - MYSQL_PASSWORD=${DB_PW}
    volumes:
      - db-data:/var/lib/mysql
    networks: [web]

  # CVE-2021-44228 (Log4Shell) 취약 앱 — 다단계 시나리오용
  log4shell:
    # TODO: 취약 앱 이미지 확정 (예: christophetd/log4shell-vulnerable-app)
    image: ghcr.io/christophetd/log4shell-vulnerable-app:latest
    container_name: log4shell-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks: [web]

volumes:
  db-data:

networks:
  web:
    driver: bridge

# 권한상승(CVE-2021-3156 sudo Baron Samedit)은 컨테이너가 아니라
# Groot_C VM OS에 취약 sudo 패키지로 구성한다(격리 환경 전용).
