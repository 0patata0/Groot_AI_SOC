# Install as /etc/nginx/conf.d/zz-capstone-labs.conf in the existing WAF.
# Root-owned host source: /etc/capstone-offline-labs-waf/waf-log4shell-server.conf.
# scripts/apply-waf.py copies it into the existing container without recreation;
# reapply after an approved full recreation. Existing producer binds stay intact.
# The shared ModSecurity rules and existing evidence producer remain inherited.
# Native TCP inspection on 2026-10-22 showed chatproxy 172.19.0.2 -> A:80 is
# SNATed to 172.18.0.1 at WAF 172.18.0.2:8080. This trusts the A host/bridge
# boundary, not a unique chatproxy identity. Network drift must fail closed.
map $realip_remote_addr $capstone_lab_peer_allowed {
    default 0;
    172.18.0.1 1;
}

log_format capstone_lab_mode escape=json
    '{"event":"capstone.lab.request","request_id":"$http_x_capstone_lab_request",'
    '"waf_request_id":"$request_id","source_ip":"$remote_addr",'
    '"proxy_peer":"$realip_remote_addr","mode":"$http_x_capstone_lab_mode",'
    '"time_iso8601":"$time_iso8601","method":"$request_method","status":$status}';

server {
    listen 8080;
    server_name log4shell.grootlab.duckdns.org;
    absolute_redirect off;

    location = /log4shell/labs/CVE-2021-44228 {
        return 308 https://log4shell.grootlab.duckdns.org/log4shell/labs/CVE-2021-44228/;
    }

    location ^~ /log4shell/labs/CVE-2021-44228/ {
        set_real_ip_from 172.18.0.1;
        real_ip_header X-Capstone-Lab-Client;
        real_ip_recursive off;

        # Use the original connection peer after real_ip restores the client.
        # allow/deny on $remote_addr would instead check the restored user IP.
        if ($capstone_lab_peer_allowed = 0) { return 403; }
        if ($http_x_capstone_lab_mode !~ "^(enforce|exempt)$") { return 403; }
        if ($http_x_capstone_lab_request !~ "^[a-f0-9]{32}$") { return 403; }
        if ($http_x_capstone_lab_client = "") { return 403; }
        client_max_body_size 8k;

        # Keep both existing access outputs when adding the mode-only output.
        # No credential, cookie, authorization header, query or body is logged here.
        access_log /var/log/nginx/access.log main;
        access_log /var/log/modsecurity/capstone-access.log capstone_waf_evidence;
        access_log /var/log/modsecurity/capstone-lab-access.log capstone_lab_mode;

        proxy_pass http://10.200.10.20:80/_offline-lab-java/;
        proxy_http_version 1.1;
        proxy_set_header Host log4shell.grootlab.duckdns.org;
        proxy_set_header Authorization "";
        proxy_set_header Proxy "";
        # Preserve C's existing A-only private route ACL. The client identity is
        # already recorded by WAF and travels separately in the Capstone header.
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Groot-Lab-TLS "1";
        proxy_set_header X-Lab-Gateway "";
        proxy_set_header X-Lab-Client-IP "";
        proxy_set_header X-Lab-Request-ID "";
        proxy_set_header X-Capstone-Lab-Mode $http_x_capstone_lab_mode;
        proxy_set_header X-Capstone-Lab-Client $remote_addr;
        proxy_set_header X-Capstone-Lab-Request $http_x_capstone_lab_request;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        proxy_send_timeout 15s;
        proxy_redirect off;
        proxy_cookie_path /log4shell/ /log4shell/labs/CVE-2021-44228/;
        proxy_cookie_flags __Secure-groot_log4shell_java_https secure httponly samesite=strict;
    }

    location = /log4shell/labs/CVE-2021-41773 {
        return 308 https://log4shell.grootlab.duckdns.org/log4shell/labs/CVE-2021-41773/;
    }

    location ^~ /log4shell/labs/CVE-2021-41773/ {
        set_real_ip_from 172.18.0.1;
        real_ip_header X-Capstone-Lab-Client;
        real_ip_recursive off;

        # Use the original connection peer after real_ip restores the client.
        # allow/deny on $remote_addr would instead check the restored user IP.
        if ($capstone_lab_peer_allowed = 0) { return 403; }
        if ($http_x_capstone_lab_mode !~ "^(enforce|exempt)$") { return 403; }
        if ($http_x_capstone_lab_request !~ "^[a-f0-9]{32}$") { return 403; }
        if ($http_x_capstone_lab_client = "") { return 403; }
        client_max_body_size 8k;

        # Keep both existing access outputs when adding the mode-only output.
        # No credential, cookie, authorization header, query or body is logged here.
        access_log /var/log/nginx/access.log main;
        access_log /var/log/modsecurity/capstone-access.log capstone_waf_evidence;
        access_log /var/log/modsecurity/capstone-lab-access.log capstone_lab_mode;

        proxy_pass http://10.200.10.20:80/_offline-lab-httpd49/;
        proxy_http_version 1.1;
        proxy_set_header Host log4shell.grootlab.duckdns.org;
        proxy_set_header Authorization "";
        proxy_set_header Proxy "";
        # Preserve C's existing A-only private route ACL. The client identity is
        # already recorded by WAF and travels separately in the Capstone header.
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Groot-Lab-TLS "1";
        proxy_set_header X-Lab-Gateway "";
        proxy_set_header X-Lab-Client-IP "";
        proxy_set_header X-Lab-Request-ID "";
        proxy_set_header X-Capstone-Lab-Mode $http_x_capstone_lab_mode;
        proxy_set_header X-Capstone-Lab-Client $remote_addr;
        proxy_set_header X-Capstone-Lab-Request $http_x_capstone_lab_request;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        proxy_send_timeout 15s;
        proxy_redirect off;
    }

    location = /log4shell/labs/CVE-2021-42013 {
        return 308 https://log4shell.grootlab.duckdns.org/log4shell/labs/CVE-2021-42013/;
    }

    location ^~ /log4shell/labs/CVE-2021-42013/ {
        set_real_ip_from 172.18.0.1;
        real_ip_header X-Capstone-Lab-Client;
        real_ip_recursive off;

        # Use the original connection peer after real_ip restores the client.
        # allow/deny on $remote_addr would instead check the restored user IP.
        if ($capstone_lab_peer_allowed = 0) { return 403; }
        if ($http_x_capstone_lab_mode !~ "^(enforce|exempt)$") { return 403; }
        if ($http_x_capstone_lab_request !~ "^[a-f0-9]{32}$") { return 403; }
        if ($http_x_capstone_lab_client = "") { return 403; }
        client_max_body_size 8k;

        # Keep both existing access outputs when adding the mode-only output.
        # No credential, cookie, authorization header, query or body is logged here.
        access_log /var/log/nginx/access.log main;
        access_log /var/log/modsecurity/capstone-access.log capstone_waf_evidence;
        access_log /var/log/modsecurity/capstone-lab-access.log capstone_lab_mode;

        proxy_pass http://10.200.10.20:80/_offline-lab-httpd50/;
        proxy_http_version 1.1;
        proxy_set_header Host log4shell.grootlab.duckdns.org;
        proxy_set_header Authorization "";
        proxy_set_header Proxy "";
        # Preserve C's existing A-only private route ACL. The client identity is
        # already recorded by WAF and travels separately in the Capstone header.
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Groot-Lab-TLS "1";
        proxy_set_header X-Lab-Gateway "";
        proxy_set_header X-Lab-Client-IP "";
        proxy_set_header X-Lab-Request-ID "";
        proxy_set_header X-Capstone-Lab-Mode $http_x_capstone_lab_mode;
        proxy_set_header X-Capstone-Lab-Client $remote_addr;
        proxy_set_header X-Capstone-Lab-Request $http_x_capstone_lab_request;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        proxy_send_timeout 15s;
        proxy_redirect off;
    }

    location ^~ /log4shell/labs/ { return 404; }

    # The normal public HTTP entry remains HTTPS-only. No private C route is
    # reachable through this virtual host; other WAF hostnames keep their server.
    location / {
        return 308 https://log4shell.grootlab.duckdns.org/log4shell/;
    }
}
