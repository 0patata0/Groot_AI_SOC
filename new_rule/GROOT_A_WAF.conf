# =============================================================================
# GROOT_A_WAF.conf  -  GROOT layered architecture, layer A (inline WAF)
# -----------------------------------------------------------------------------
# Engine    : ModSecurity v3 (libmodsecurity) + ModSecurity-nginx connector
# Baseline  : OWASP CRS 4.29.0 (this file SUPPLEMENTS CRS, it does not replace it)
# Position  : nginx reverse proxy in front of DVWA, inspecting decrypted HTTP
# Mode      : DetectionOnly (tuning phase). Switch to On only after the
#             false-positive review described in section 6.
# Version   : 1.0.0  (2026-10-02)      Owner: GROOT security team
#
# Division of labour (keep current to avoid duplicate alerts across layers):
#   nftables (L3/L4)   : rate limits, IP/geo block lists, port policy.
#   Suricata (passive) : wire-level signatures, scanner UAs, C2, protocol
#                        anomalies. Cannot decrypt TLS or parse app logic.
#   This WAF (L7)      : decoded request semantics (URL/HTML/JS decoding,
#                        body parsing, header validation, app-specific CVEs).
#   Add a rule here only if detection NEEDS the decoded request or app
#   context. Scanner-UA, DoS and IP-reputation rules belong to IPS / FW.
#
# ID scheme (ModSecurity ids MUST be numeric; the WAF- label lives in msg/tag):
#   10000-10099  helpers / exclusions (no alert)
#   10100-10199  WAF-HDR-*   header manipulation
#   10200-10299  WAF-SQLI-*  SQL injection
#   10300-10399  WAF-XSS-*   cross-site scripting
#   10400-10499  WAF-RCE-*   OS command injection
#   10500-10599  WAF-LFI-* / WAF-RFI-*  file inclusion / traversal
#   10600-10699  WAF-CVE-*   named critical CVEs
#   Range 1-99999 is reserved by CRS for local rules, so there is no collision
#   with CRS (900000-999999). Suricata local sids (1000000+) are a separate
#   namespace; Wazuh rule ids (100000+) are a third one.
#
# Severity model (feeds CRS anomaly scoring AND Wazuh via tags):
#   high   -> severity:CRITICAL (+critical_anomaly_score, 5) tag GROOT_A/priority/high
#   medium -> severity:WARNING  (+warning_anomaly_score,  3) tag GROOT_A/priority/medium
#   low    -> severity:NOTICE   (+notice_anomaly_score,   2) tag GROOT_A/priority/low
#
# Load order: AFTER CRS REQUEST-944 and BEFORE REQUEST-949-BLOCKING-EVALUATION
# so these scores take part in the CRS inbound evaluation. Example main.conf:
#   Include /etc/nginx/modsec/modsecurity.conf
#   Include /etc/nginx/modsec/crs/crs-setup.conf
#   Include /etc/nginx/modsec/crs/rules/REQUEST-901-INITIALIZATION.conf
#   ...   (REQUEST-905 .. REQUEST-944)
#   Include /etc/nginx/modsec/GROOT_A_WAF.conf
#   Include /etc/nginx/modsec/crs/rules/REQUEST-949-BLOCKING-EVALUATION.conf
#   Include /etc/nginx/modsec/crs/rules/RESPONSE-*.conf
# Alternative: symlink this file into rules/ as REQUEST-945-GROOT_A_WAF.conf so
# a plain "Include rules/*.conf" orders it correctly.
#
# Disruptive action is "block" on every rule. With the CRS SecDefaultAction
# ("pass") that means: score, log, continue. Enforcement happens in CRS 949
# once SecRuleEngine is On. Nothing here blocks on its own.
# =============================================================================


# -----------------------------------------------------------------------------
# 1. Engine mode and Wazuh-compatible audit logging
# -----------------------------------------------------------------------------
# Last directive wins, so this overrides modsecurity.conf when loaded after it.
SecRuleEngine DetectionOnly
SecComponentSignature "GROOT_A_WAF/1.0.0"

# Audit logging is intentionally NOT overridden here. This file SUPPLEMENTS CRS,
# so it inherits the reverse proxy's base ModSecurity audit config and every GROOT
# rule match lands in the SAME file Wazuh already collects. An earlier version set
# "SecAuditLog /var/log/modsec/modsec_audit.json", which is NOT the mounted/collected
# path on groot-sec and would have silently dropped all WAF alerts. Removed 2026-10-02.
# Verified live base (owasp/modsecurity-crs:nginx on groot-sec, 2026-10-02):
#   SecAuditEngine            RelevantOnly
#   SecAuditLog               /var/log/modsecurity/audit.log      (container path)
#        -> host   /home/groot_a/capstone/secstack/logs/modsec/audit.log
#        -> Wazuh  agent 001 (groot-sec) localfile, log_format json,
#                  label capstone.source=modsecurity  ->  manager -> indexer
#   SecAuditLogFormat JSON   SecAuditLogType Serial   SecAuditLogParts ABIJDEFHZ
#   SecAuditLogRelevantStatus "^(?:5|4(?!04))"   (H part carries rule id/msg/tags/severity)


# -----------------------------------------------------------------------------
# 2. Header manipulation  (WAF-HDR-*)
#    nginx is the first hop, so X-Forwarded-For is attacker-controlled input.
#    REMOTE_ADDR is the authoritative client address at this layer.
# -----------------------------------------------------------------------------

# WAF-HDR-001  [medium]  X-Forwarded-For is not a comma-separated list of IPs.
# Catches log poisoning, SQLi/XSS smuggled via XFF, and proxy-chain spoofing.
# Deliberately NO decoding transformations: the header must be well-formed as sent.
SecRule REQUEST_HEADERS:X-Forwarded-For "!@rx (?i)^\s*(?:unknown|\[?[0-9a-f:.]{2,45}\]?)(?:\s*,\s*(?:unknown|\[?[0-9a-f:.]{2,45}\]?))*\s*$" \
    "id:10100,\
    phase:1,\
    block,\
    t:none,\
    msg:'WAF-HDR-001 Malformed X-Forwarded-For header (header manipulation)',\
    logdata:'client=%{REMOTE_ADDR} xff=%{MATCHED_VAR}',\
    tag:'GROOT_A/WAF-HDR-001',\
    tag:'GROOT_A/category/header-manipulation',\
    tag:'GROOT_A/priority/medium',\
    tag:'capec/1000/210/272',\
    severity:'WARNING',\
    ver:'GROOT_A_WAF/1.0.0',\
    setvar:'tx.http_violation_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

# WAF-HDR-002  [low]  Client claims a loopback / private / link-local source
# in the FIRST XFF value. Typical of IP-allowlist bypass attempts against the
# backend. If a trusted load balancer is ever placed in front of nginx, this
# rule must be re-scoped to the LB-appended value or it will false-positive.
SecRule REQUEST_HEADERS:X-Forwarded-For "@rx (?i)^\s*(?:127\.|10\.|192\.168\.|172\.(?:1[6-9]|2[0-9]|3[01])\.|169\.254\.|0\.0\.0\.0|::1\b|::ffff:(?:127|10)\.|localhost)" \
    "id:10101,\
    phase:1,\
    block,\
    t:none,\
    msg:'WAF-HDR-002 X-Forwarded-For spoofs an internal or loopback address',\
    logdata:'client=%{REMOTE_ADDR} xff=%{MATCHED_VAR}',\
    tag:'GROOT_A/WAF-HDR-002',\
    tag:'GROOT_A/category/header-manipulation',\
    tag:'GROOT_A/priority/low',\
    tag:'capec/1000/210/272',\
    severity:'NOTICE',\
    ver:'GROOT_A_WAF/1.0.0',\
    setvar:'tx.http_violation_score=+%{tx.notice_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.notice_anomaly_score}'"


# -----------------------------------------------------------------------------
# 3. Injection  (WAF-SQLI-*, WAF-XSS-*, WAF-RCE-*)
#    CRS 942/941/932 already provide broad coverage (libinjection etc.).
#    These rules are narrow, high-confidence signatures that give Wazuh a
#    dedicated WAF- label for the DVWA attack surface. Each uses a cheap
#    @pm prefilter chained to a precise @rx so the regex only runs on
#    candidate values (performance practice).
# -----------------------------------------------------------------------------

# WAF-SQLI-001  [high]  UNION / time-based / file-read / stacked-exec SQLi.
# Also inspects XFF, UA and Referer: common "second-order" injection vectors.
SecRule ARGS|ARGS_NAMES|REQUEST_COOKIES|REQUEST_HEADERS:User-Agent|REQUEST_HEADERS:Referer|REQUEST_HEADERS:X-Forwarded-For|XML:/* \
    "@pm union sleep( benchmark( pg_sleep( information_schema load_file outfile dumpfile xp_cmdshell waitfor @@version" \
    "id:10200,\
    phase:2,\
    block,\
    chain,\
    t:none,t:urlDecodeUni,t:htmlEntityDecode,t:compressWhitespace,\
    msg:'WAF-SQLI-001 SQL injection (union / time-based / file access / stacked exec)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR} client=%{REMOTE_ADDR}',\
    tag:'GROOT_A/WAF-SQLI-001',\
    tag:'GROOT_A/category/sqli',\
    tag:'GROOT_A/priority/high',\
    tag:'capec/1000/152/248/66',\
    severity:'CRITICAL',\
    ver:'GROOT_A_WAF/1.0.0'"
    SecRule MATCHED_VARS "@rx (?i)(?:\bunion\b[\s/*]+(?:all\s+|distinct\s+)?select\b|\b(?:sleep|benchmark|pg_sleep)\s*\(|\binformation_schema\s*\.|\bload_file\s*\(|\binto\s+(?:out|dump)file\b|xp_cmdshell|\bwaitfor\s+delay\b|@@version)" \
        "t:none,t:urlDecodeUni,t:htmlEntityDecode,t:compressWhitespace,\
        capture,\
        setvar:'tx.sql_injection_score=+%{tx.critical_anomaly_score}',\
        setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# WAF-XSS-001  [high]  Script tags, inline event handlers on HTML elements,
# javascript: URIs, srcdoc. DVWA accepts no legitimate HTML input, so this
# is expected to be near-zero FP there.
SecRule ARGS|ARGS_NAMES|REQUEST_COOKIES|REQUEST_HEADERS:User-Agent|REQUEST_HEADERS:Referer|XML:/* \
    "@pm <script javascript: onerror onload onmouseover onfocus onclick srcdoc <svg <img <iframe <body <object <embed <details <video <audio" \
    "id:10300,\
    phase:2,\
    block,\
    chain,\
    t:none,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,\
    msg:'WAF-XSS-001 Cross-site scripting (script tag / event handler / javascript URI)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR} client=%{REMOTE_ADDR}',\
    tag:'GROOT_A/WAF-XSS-001',\
    tag:'GROOT_A/category/xss',\
    tag:'GROOT_A/priority/high',\
    tag:'capec/1000/152/242',\
    severity:'CRITICAL',\
    ver:'GROOT_A_WAF/1.0.0'"
    SecRule MATCHED_VARS "@rx (?i)(?:<\s*/?\s*script\b|<\s*(?:svg|img|iframe|body|object|embed|details|video|audio|input|a|div)\b[^>]*\bon[a-z]+\s*=|\bjavascript\s*:|\bsrcdoc\s*=)" \
        "t:none,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:compressWhitespace,\
        capture,\
        setvar:'tx.xss_score=+%{tx.critical_anomaly_score}',\
        setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# WAF-RCE-001  [high]  OS command injection: a shell metacharacter or
# substitution immediately followed by a known binary (DVWA "Command
# Injection" page: ip=127.0.0.1; cat /etc/passwd). Anchored on the
# metacharacter, so a bare word like "cat" in a search box does not fire.
# No @pm prefilter: short command names (ls, id, sh) would defeat it.
SecRule ARGS|ARGS_NAMES|REQUEST_COOKIES|REQUEST_HEADERS:User-Agent|REQUEST_HEADERS:X-Forwarded-For|XML:/* \
    "@rx (?i)(?:[;&|`\n]|\|\||&&|\$\(|\$\{)\s*(?:/(?:usr/|usr/local/)?s?bin/)?(?:cat|ls|id|whoami|uname|pwd|nc|ncat|netcat|bash|sh|dash|zsh|ksh|wget|curl|python[23]?|perl|php|ruby|nmap|chmod|chown|rm|mkfifo|telnet|busybox|powershell|cmd(?:\.exe)?|certutil|bitsadmin|nslookup|dig)\b|\$\{ifs\}" \
    "id:10400,\
    phase:2,\
    block,\
    t:none,t:urlDecodeUni,t:htmlEntityDecode,t:compressWhitespace,\
    capture,\
    msg:'WAF-RCE-001 OS command injection (shell metacharacter followed by command)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR} client=%{REMOTE_ADDR}',\
    tag:'GROOT_A/WAF-RCE-001',\
    tag:'GROOT_A/category/rce',\
    tag:'GROOT_A/priority/high',\
    tag:'capec/1000/152/248/88',\
    severity:'CRITICAL',\
    ver:'GROOT_A_WAF/1.0.0',\
    setvar:'tx.rce_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"


# -----------------------------------------------------------------------------
# 4. File inclusion and traversal  (WAF-LFI-*, WAF-RFI-*)
# -----------------------------------------------------------------------------

# WAF-LFI-001  [high]  Directory traversal, PHP stream wrappers and sensitive
# file names (DVWA "File Inclusion": page=../../etc/passwd, page=php://filter).
# Double URL decoding is intentional: catches CVE-2021-41773 / CVE-2021-42013
# style ".%2e/" and ".%%32%65/" sequences. normalisePath is NOT used because
# it would collapse the very ".." we are looking for.
SecRule ARGS|ARGS_NAMES|REQUEST_COOKIES|REQUEST_URI|REQUEST_HEADERS:Referer|XML:/* \
    "@rx (?i)(?:(?:^|[\\/])\.\.(?:[\\/]|$)|(?:^|[\\/])\.\.(?:%2f|%5c)|\.%2e[\\/]|%2e\.[\\/]|\b(?:php|phar|zip|expect|glob|compress\.zlib|compress\.bzip2|file)://|/etc/(?:passwd|shadow|group|hosts|issue)\b|/proc/self/|\bboot\.ini\b|\bwin\.ini\b|c:[\\/]windows[\\/])" \
    "id:10500,\
    phase:2,\
    block,\
    t:none,t:urlDecodeUni,t:urlDecode,t:htmlEntityDecode,\
    capture,\
    msg:'WAF-LFI-001 Path traversal / local file inclusion / PHP wrapper',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR} client=%{REMOTE_ADDR}',\
    tag:'GROOT_A/WAF-LFI-001',\
    tag:'GROOT_A/category/lfi',\
    tag:'GROOT_A/priority/high',\
    tag:'CVE-2021-41773',\
    tag:'CVE-2021-42013',\
    tag:'capec/1000/255/153/126',\
    severity:'CRITICAL',\
    ver:'GROOT_A_WAF/1.0.0',\
    setvar:'tx.lfi_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# WAF-RFI-001  [medium]  A file-style parameter whose value is a remote URL
# (DVWA: page=http://attacker/shell.txt). Scoped to file-ish parameter names
# only; generic url/redirect/next parameters are excluded on purpose because
# they legitimately carry URLs (those are SSRF/open-redirect, handled separately).
# NOTE (2026-10-02): libmodsecurity v3 cannot parse a regex variable selector
# (ARGS:/regex/) in this position -- it aborts rule loading ("Expecting a
# variable"), so nginx fails to start. The names are therefore listed
# explicitly. Case-sensitive on purpose: the backend is PHP (DVWA) and PHP
# parameter names are case-sensitive, so only the exact lowercase name ever
# reaches the application; nothing is lost versus the former (?i) selector.
SecRule ARGS:page|ARGS:file|ARGS:filename|ARGS:path|ARGS:include|ARGS:inc|ARGS:template|ARGS:tpl|ARGS:doc|ARGS:dir|ARGS:lang|ARGS:module|ARGS:view|ARGS:load|ARGS:src|ARGS:plugin|ARGS:theme|ARGS:layout \
    "@rx (?i)^\s*(?:https?|ftps?|smb|gopher|dict|ldap|tftp)://" \
    "id:10501,\
    phase:2,\
    block,\
    t:none,t:urlDecodeUni,t:htmlEntityDecode,\
    msg:'WAF-RFI-001 Remote file inclusion attempt via file-type parameter',\
    logdata:'Matched Data: %{MATCHED_VAR_NAME}: %{MATCHED_VAR} client=%{REMOTE_ADDR}',\
    tag:'GROOT_A/WAF-RFI-001',\
    tag:'GROOT_A/category/rfi',\
    tag:'GROOT_A/priority/medium',\
    tag:'capec/1000/152/175/253',\
    severity:'WARNING',\
    ver:'GROOT_A_WAF/1.0.0',\
    setvar:'tx.rfi_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"


# -----------------------------------------------------------------------------
# 5. Named critical CVEs  (WAF-CVE-*)
#    Kept even where DVWA (PHP) is not vulnerable: these are cheap and show
#    which campaigns are hitting the edge. Disable per stack via the
#    GROOT_A/stack/* tags in section 6 if noise becomes a problem.
# -----------------------------------------------------------------------------

# WAF-CVE-001  [high]  Log4Shell (CVE-2021-44228 / 45046) and Text4Shell
# (CVE-2022-42889). Matches ${jndi: and the usual lookup obfuscations
# (${lower:j}ndi, ${${env:X:-j}ndi ...) by flagging ANY nested ${...${ within
# 20 chars, plus the Text4Shell script/dns/url prefixes. Entity and URL
# obfuscation (%24%7B, &#36;&#123;) is undone by the transformations.
# Complements CRS 944150: this one also inspects every header incl. XFF.
SecRule REQUEST_HEADERS|REQUEST_URI|ARGS|ARGS_NAMES|REQUEST_COOKIES|XML:/* \
    "@rx \$\{(?:[^}]{0,20}\$\{|\s*(?:jndi|ctx|lower|upper|env|sys|java|base64|main|bundle|map|script|dns|url)\s*:)" \
    "id:10600,\
    phase:2,\
    block,\
    t:none,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:lowercase,\
    capture,\
    msg:'WAF-CVE-001 Log4Shell / Text4Shell JNDI or lookup injection',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR} client=%{REMOTE_ADDR}',\
    tag:'GROOT_A/WAF-CVE-001',\
    tag:'GROOT_A/category/rce',\
    tag:'GROOT_A/priority/high',\
    tag:'CVE-2021-44228',\
    tag:'CVE-2021-45046',\
    tag:'CVE-2022-42889',\
    tag:'capec/1000/152/137/6',\
    severity:'CRITICAL',\
    ver:'GROOT_A_WAF/1.0.0',\
    setvar:'tx.rce_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# WAF-CVE-002  [high]  PHP-CGI argument injection, CVE-2024-4577 (soft hyphen
# %AD interpreted as "-" on Windows locales) and its ancestor CVE-2012-1823.
# Directly relevant to a PHP target like DVWA. Inspects the RAW query string
# with NO decoding so the %AD / %C2%AD encodings are seen as sent.
SecRule QUERY_STRING "@rx (?i)(?:%ad|%c2%ad|^-|[?&+ ]-)(?:d(?:\+|%20|\s)*(?:allow_url_include|auto_prepend_file|auto_append_file|cgi\.force_redirect|cgi\.redirect_status_env|disable_functions|open_basedir|safe_mode|extension(?:_dir)?|include_path)|s(?:$|[+&%\s]))" \
    "id:10601,\
    phase:1,\
    block,\
    t:none,\
    capture,\
    msg:'WAF-CVE-002 PHP-CGI argument injection (CVE-2024-4577 / CVE-2012-1823)',\
    logdata:'Matched Data: %{TX.0} in query string: %{MATCHED_VAR} client=%{REMOTE_ADDR}',\
    tag:'GROOT_A/WAF-CVE-002',\
    tag:'GROOT_A/category/rce',\
    tag:'GROOT_A/priority/high',\
    tag:'GROOT_A/stack/php',\
    tag:'CVE-2024-4577',\
    tag:'CVE-2012-1823',\
    tag:'capec/1000/152/137',\
    severity:'CRITICAL',\
    ver:'GROOT_A_WAF/1.0.0',\
    setvar:'tx.rce_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# WAF-CVE-003  [high]  Java expression injection: Spring4Shell
# (CVE-2022-22965, class.module.classLoader.* in parameter names), Confluence
# OGNL (CVE-2022-26134, ${(#...) in the URI) and Struts OGNL
# (CVE-2017-5638, %{(# in Content-Type). Tagged stack/java so it can be
# removed by tag while the only backend is PHP.
SecRule ARGS_NAMES|REQUEST_URI|REQUEST_HEADERS:Content-Type \
    "@rx (?i)(?:(?:^|[.\[])class\.(?:module\.)?classloader[.\[]|[%$]\{\s*\(\s*#|@java\.lang\.runtime@|#_memberaccess)" \
    "id:10602,\
    phase:2,\
    block,\
    t:none,t:urlDecodeUni,\
    capture,\
    msg:'WAF-CVE-003 Java expression injection (Spring4Shell / OGNL)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR} client=%{REMOTE_ADDR}',\
    tag:'GROOT_A/WAF-CVE-003',\
    tag:'GROOT_A/category/rce',\
    tag:'GROOT_A/priority/high',\
    tag:'GROOT_A/stack/java',\
    tag:'CVE-2022-22965',\
    tag:'CVE-2022-26134',\
    tag:'CVE-2017-5638',\
    tag:'capec/1000/152/137/6',\
    severity:'CRITICAL',\
    ver:'GROOT_A_WAF/1.0.0',\
    setvar:'tx.rce_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"


# -----------------------------------------------------------------------------
# 6. Tuning and lifecycle
# -----------------------------------------------------------------------------
# Workflow
#   1. Run DetectionOnly for at least two weeks of representative traffic.
#   2. In Wazuh, group alerts by rule id (transaction.messages ruleId) and
#      review every id with more than a handful of hits per day.
#   3. Fix each false positive with the NARROWEST exclusion (target removal
#      on one rule for one parameter beats removing the rule). Record date,
#      owner and reason next to each exclusion below.
#   4. Set SecRuleEngine On. Keep individual rules in detect-only with
#      ctl:ruleEngine=DetectionOnly on a scoped SecRule if still unsure.
#   5. Review quarterly and on every CRS upgrade (re-check the tx.* variable
#      names used above against the new crs-setup.conf).
#
# Exclusion templates (uncomment and adapt; keep ids in 10000-10099):
#
# DVWA guestbook: only if HTML is ever expected in the message field.
# SecRuleUpdateTargetById 10300 "!ARGS:mtxMessage"
#
# Do NOT exclude ARGS:ip from 10400 for DVWA: that parameter IS the attack
# surface the lab is built around.
#
# Backend is PHP-only (DVWA): silence the Java CVE rule until Java is deployed.
# SecRuleRemoveByTag "GROOT_A/stack/java"
#
# Skip all GROOT rules on an admin-only setup page reached from a jump host.
# SecRule REQUEST_URI "@beginsWith /dvwa/setup.php" \
#     "id:10010,phase:1,pass,nolog,t:none,ctl:ruleRemoveById=10100-10699"


# -----------------------------------------------------------------------------
# 7. Wazuh integration (reference, not ModSecurity syntax)
# -----------------------------------------------------------------------------
# Agent ossec.conf on the nginx host (ALREADY deployed on groot-sec = agent 001;
# path is the host side of the container's /var/log/modsecurity mount):
#   <localfile>
#     <log_format>json</log_format>
#     <location>/home/groot_a/capstone/secstack/logs/modsec/audit.log</location>
#     <label key="capstone.source">modsecurity</label>
#   </localfile>
#
# Manager local_rules.xml (verify field flattening with wazuh-logtest first;
# the JSON decoder serialises the transaction.messages array as a string,
# so the tag and ruleId are matched inside that string):
#   <group name="groot_a,waf,modsecurity,">
#     <rule id="100200" level="3">
#       <decoded_as>json</decoded_as>
#       <field name="transaction.messages">GROOT_A/WAF-</field>
#       <description>GROOT_A WAF: ModSecurity rule match</description>
#     </rule>
#     <rule id="100201" level="12">
#       <if_sid>100200</if_sid>
#       <field name="transaction.messages">GROOT_A/priority/high</field>
#       <description>GROOT_A WAF HIGH alert from $(transaction.client_ip)</description>
#       <mitre><id>T1190</id></mitre>
#     </rule>
#     <rule id="100202" level="8">
#       <if_sid>100200</if_sid>
#       <field name="transaction.messages">GROOT_A/priority/medium</field>
#       <description>GROOT_A WAF MEDIUM alert from $(transaction.client_ip)</description>
#     </rule>
#     <rule id="100203" level="5">
#       <if_sid>100200</if_sid>
#       <field name="transaction.messages">GROOT_A/priority/low</field>
#       <description>GROOT_A WAF LOW alert from $(transaction.client_ip)</description>
#     </rule>
#   </group>
#
# Correlation hint: transaction.client_ip here equals the src_ip in Suricata
