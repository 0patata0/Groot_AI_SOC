# Groot_A — 채팅(Mattermost) 이름 기반 리버스 프록시. A:443 → B(10.10.10.10):8065.
# 목적: VPN(443만 통과)·캠퍼스 어디서나 https://chat.groot.lab 동일 URL, 웹소켓(실시간) 정상. 루프백/터널 불필요.
# 보안: Host 가 chat.groot.lab 일 때만 응답. 맨 IP/다른 Host 는 444(무응답) → 기본 URL 에 포털/서비스 노출 안 함.
worker_processes auto;
events { worker_connections 1024; }
http {
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    # 맨 IP·다른 Host·SNI 불일치 → 아무 응답 없이 종료
    server {
        listen 8443 ssl default_server;
        ssl_certificate     /etc/nginx/tls/chat.crt;
        ssl_certificate_key /etc/nginx/tls/chat.key;
        return 444;
    }

    server {
        listen 8443 ssl;
        server_name chat.groot.lab;
        ssl_certificate     /etc/nginx/tls/chat.crt;
        ssl_certificate_key /etc/nginx/tls/chat.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 110M;              # Mattermost 기본 MaxFileSize(100M) + 여유(멀티파트 오버헤드)
        proxy_read_timeout 600s; proxy_send_timeout 600s;

        location / {
            proxy_pass http://10.10.10.10:8065;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;          # 웹소켓 업그레이드
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
