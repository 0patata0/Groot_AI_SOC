<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <title>격리 터미널 · Lab Console</title>
  <link rel="icon" type="image/x-icon" href="/log4shell/static/lab-console-icon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/log4shell/static/apple-touch-icon.png?v=20261023-2">
  <link rel="stylesheet" href="/log4shell/static/terminal-vendor/xterm.css">
  <link rel="stylesheet" href="/log4shell/static/terminal.css">
  <script src="/log4shell/static/terminal-vendor/xterm.js" defer></script>
  <script src="/log4shell/static/terminal-vendor/addon-fit.js" defer></script>
  <script src="/log4shell/static/terminal.js" defer></script>
</head>
<body>
  <a class="terminal-skip" href="#terminal-screen">터미널로 이동</a>
  <main class="app-shell terminal-shell">
    <header class="terminal-header">
      <a class="terminal-home" href="/log4shell/">Lab Console <span aria-hidden="true">↗</span></a>
      <span class="terminal-eyebrow">ISOLATED WORKSPACE</span>
    </header>
    <section class="terminal-intro" aria-labelledby="terminal-title">
      <div><p id="terminal-cve" class="terminal-eyebrow">WEB TERMINAL</p><h1 id="terminal-title">격리 터미널</h1><p class="terminal-summary">선택한 실습 환경에 연결합니다. 환경의 시작과 중지는 콘솔에서 관리하세요.</p></div>
      <div class="terminal-actions"><button id="terminal-reconnect" type="button" disabled>재연결</button><button id="terminal-close" type="button" disabled>연결 종료</button></div>
    </section>
    <div class="terminal-statusbar"><span id="terminal-status" role="status" aria-live="polite">연결 준비 중</span><span id="terminal-size">—</span></div>
    <div id="terminal-screen" class="terminal-screen" aria-label="격리 실습 터미널"></div>
    <footer class="terminal-footer"><p id="terminal-notice" role="status" aria-live="polite">연결 종료와 실습 중지 정책은 연결 후 안내를 확인하세요.</p><span>LOCAL LAB · UTF-8</span></footer>
  </main>
  <noscript><p class="terminal-noscript">터미널을 사용하려면 JavaScript를 허용해야 합니다.</p></noscript>
</body>
</html>
