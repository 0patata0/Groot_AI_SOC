[Service]
# B only: the pre-created root0600 log is inside the existing manager volume.
# SuccessExitStatus=2/75 is inherited: unknown is relayed, stale/busy is checked.
ExecStartPost=/usr/local/lib/capstone-storage-monitor/relay-b.sh
ReadWritePaths=/var/lib/docker/volumes/single-node_wazuh_logs/_data
TimeoutStartSec=60s
