# Narrow native CRS exceptions for the two observed Imperva reachability probes.
# Load BEFORE REQUEST-920, e.g. through the existing rules/*.conf include.
# IDs 10020/10021 must be collision-checked against the complete loaded rules.
# Actual observed requests contain neither Content-Length nor Transfer-Encoding.
# Content-Length: 0 is intentionally NOT exempted; reassess if observed later.
# Phase 1 cannot prove final body length or response status. These are header/
# request-line conditions, not a claim that the eventual response will be 302.
# Never suppress 949110, ruleEngine, auditEngine, SQLi/XSS rules, or all .9 traffic.
# Current container destination is deliberately pinned: IP drift fails closed.

# Observed HTTP/1.0 GET / with no Host, CL or TE: remove only missing-Host check.
SecRule REMOTE_ADDR "@ipMatch 211.170.162.9" \
    "id:10020,phase:1,pass,nolog,t:none,chain"
    SecRule SERVER_ADDR "@ipMatch 172.18.0.2" "t:none,chain"
    SecRule SERVER_PORT "@eq 8080" "t:none,chain"
    SecRule REQUEST_METHOD "@streq GET" "t:none,chain"
    SecRule REQUEST_URI_RAW "@streq /" "t:none,chain"
    SecRule REQUEST_PROTOCOL "@streq HTTP/1.0" "t:none,chain"
    SecRule &REQUEST_HEADERS:Host "@eq 0" "t:none,chain"
    SecRule &REQUEST_HEADERS:Content-Length "@eq 0" "t:none,chain"
    SecRule &REQUEST_HEADERS:Transfer-Encoding "@eq 0" \
        "t:none,ctl:ruleRemoveById=920280"

# Observed HTTP/1.1 GET / with one exact numeric Host, no CL or TE:
# remove only numeric-Host check; all other CRS checks and scoring stay active.
SecRule REMOTE_ADDR "@ipMatch 211.170.162.9" \
    "id:10021,phase:1,pass,nolog,t:none,chain"
    SecRule SERVER_ADDR "@ipMatch 172.18.0.2" "t:none,chain"
    SecRule SERVER_PORT "@eq 8080" "t:none,chain"
    SecRule REQUEST_METHOD "@streq GET" "t:none,chain"
    SecRule REQUEST_URI_RAW "@streq /" "t:none,chain"
    SecRule REQUEST_PROTOCOL "@streq HTTP/1.1" "t:none,chain"
    SecRule &REQUEST_HEADERS:Host "@eq 1" "t:none,chain"
    SecRule REQUEST_HEADERS:Host "@streq 192.168.16.230" "t:none,chain"
    SecRule &REQUEST_HEADERS:Content-Length "@eq 0" "t:none,chain"
    SecRule &REQUEST_HEADERS:Transfer-Encoding "@eq 0" \
        "t:none,ctl:ruleRemoveById=920350"
