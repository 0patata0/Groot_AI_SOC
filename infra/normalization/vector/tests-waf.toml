# Isolated native tests; never activate this synthetic topology as a service.
[sources.waf_test_input]
type = "demo_logs"
format = "json"
count = 0

[transforms.waf_json_guard]
type = "remap"
inputs = ["waf_test_input"]
file = "transforms/waf_json_guard.vrl"
drop_on_error = true
drop_on_abort = true
reroute_dropped = true

[sinks.waf_test_discard]
type = "blackhole"
inputs = ["waf_json_guard", "waf_json_guard.dropped", "waf_audit_guard.dropped", "waf_access_guard.dropped", "waf_audit_part.dropped", "waf_access_part.dropped", "waf_ready", "waf_pair_normalize.dropped"]

[[tests]]
name = "waf_json_simple"
[[tests.inputs]]
insert_at = "waf_json_guard"
type = "vrl"
source = '''
. = {"message": "{\"transaction\":{\"response\":{\"headers\":{\"Server\":\"nginx\"}}}}"}
'''
[[tests.outputs]]
extract_from = "waf_json_guard"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
assert_eq!(.waf_allowed_server_duplicates, 0)
assert!(is_object(.waf_json))
'''

[[tests]]
name = "waf_json_server_duplicate"
[[tests.inputs]]
insert_at = "waf_json_guard"
type = "vrl"
source = '''
. = {"message": "{\"transaction\":{\"response\":{\"headers\":{\"Server\":\"nginx\",\"Server\":\"test\"}}}}"}
'''
[[tests.outputs]]
extract_from = "waf_json_guard"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
assert_eq!(.waf_allowed_server_duplicates, 1)
assert!(is_object(.waf_json))
'''

