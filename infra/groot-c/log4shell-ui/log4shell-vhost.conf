# Existing Groot_C only. Keep 000-default.conf/DVWA as the first default vhost.
# The initial three-server installer generates its own optional hostname instead.
<VirtualHost *:80>
    ServerName log4shell.grootlab.duckdns.org
    ServerAlias log4shell.groot.lab
    DocumentRoot /var/www/html
    RedirectMatch 302 "^/(?!log4shell/).*" "/log4shell/"
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
