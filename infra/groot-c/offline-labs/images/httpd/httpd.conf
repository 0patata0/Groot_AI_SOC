# Groot file-access training configuration. No production data belongs here.
ServerRoot "/usr/local/apache2"
ServerName localhost
Listen 8080

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule alias_module modules/mod_alias.so
LoadModule headers_module modules/mod_headers.so

User #65532
Group #65532
DefaultRuntimeDir "/tmp"
PidFile "/tmp/httpd.pid"
Mutex file:/tmp default

StartServers 1
ServerLimit 2
ThreadLimit 16
ThreadsPerChild 16
MinSpareThreads 16
MaxSpareThreads 32
MaxRequestWorkers 32
MaxConnectionsPerChild 1000
Timeout 15
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 2
GracefulShutdownTimeout 5

ServerTokens Prod
ServerSignature Off
TraceEnable Off
AllowEncodedSlashes Off
EnableSendfile Off
TypesConfig conf/mime.types
AddDefaultCharset UTF-8
DirectoryIndex index.html
DocumentRoot "/lab/www"

# Deny the rest of the container filesystem, including system/runtime paths.
<Directory "/">
    AllowOverride None
    Options None
    Require all denied
</Directory>

<Directory "/lab/www">
    Require all granted
</Directory>

Alias "/lab/alias/" "/lab/public/"
<Directory "/lab/public">
    Require all granted
</Directory>

# This public marker is the only fixture permitted outside the normal web roots.
# It is deliberately not exposed through its own Alias.
<Directory "/lab/fixture">
    Require all denied
    <Files "harmless.txt">
        Require all granted
    </Files>
</Directory>

ErrorLog "/proc/self/fd/2"
LogLevel warn
# Omit query strings, headers, cookies and authorization values from access logs.
LogFormat "%a %t %m %U %>s %b" lab
CustomLog "/proc/self/fd/1" lab

Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "no-referrer"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Cache-Control "no-store"
Header always set Content-Security-Policy "default-src 'none'; style-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'"
