# Existing Apache host, mod_proxy/proxy_http/remoteip already enabled.
# Public HTTP always redirects: no client-provided TLS hint can bypass this.
ProxyRequests Off
ProxyPreserveHost On
RedirectMatch 308 "^/log4shell(?:/(.*))?$" "https://log4shell.grootlab.duckdns.org/log4shell/$1"
# Only the A TLS proxy (without forwarded client-IP headers) and host loopback
# may reach the private management backend. WAF restores the real client IP,
# so public requests for this private path remain denied.
<Location "/_offline-labs/">
    Require ip 10.200.10.1 127.0.0.1
</Location>
ProxyPass "/_offline-labs/" "http://127.0.0.1:18090/" connectiontimeout=2 timeout=275 retry=0
ProxyPassReverse "/_offline-labs/" "http://127.0.0.1:18090/"
# The A WAF's dedicated lab virtual host strips X-Forwarded-For before this hop.
# Only that internal route can publish the otherwise loopback-only Java lab.
<Location "/_offline-lab-java/">
    Require ip 10.200.10.1 127.0.0.1
</Location>
ProxyPass "/_offline-lab-java/" "http://127.0.0.1:18081/log4shell/" connectiontimeout=2 timeout=20 retry=0
ProxyPassReverse "/_offline-lab-java/" "http://127.0.0.1:18081/log4shell/"

<Location "/_offline-lab-httpd49/">
    Require ip 10.200.10.1 127.0.0.1
</Location>
ProxyPass "/_offline-lab-httpd49/" "http://127.0.0.1:18082/" connectiontimeout=2 timeout=20 retry=0
ProxyPassReverse "/_offline-lab-httpd49/" "http://127.0.0.1:18082/"

<Location "/_offline-lab-httpd50/">
