[[tests]]
name = "evidence_pipeline_suricata"
[[tests.inputs]]
insert_at = "correlation_metadata"
type = "vrl"
source = ". = {\"capstone_norm\": {\"schema_version\": \"vector-1\", \"pipeline\": \"vector\", \"sensor\": \"groot-sec\", \"source\": \"suricata\", \"message_sha256\": \"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\", \"event_id\": \"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb\", \"event_time_kst\": \"2026-10-14T02:00:00+09:00\", \"observed_at_kst\": \"2026-10-14T02:01:00+09:00\", \"source_ip\": \"192.0.2.10\", \"destination_ip\": \"198.51.100.20\", \"destination_port\": 443, \"protocol\": \"tcp\", \"quality_flags\": [], \"protected_asset\": false}}"
[[tests.outputs]]
extract_from = "correlation_metadata"
[[tests.outputs.conditions]]
type = "vrl"
source = "assert!(!exists(.capstone_norm.evidence_lane))\nassert_eq!(.capstone_norm.correlation_eligible, true)"
[[tests.outputs]]
extract_from = "evidence_marker"
[[tests.outputs.conditions]]
type = "vrl"
source = "assert_eq!(.capstone_norm.evidence_lane, \"indexer-observation-v1\")\nassert_eq!(.capstone_norm.source, \"suricata\")"

