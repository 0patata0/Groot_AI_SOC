[[tests]]
name = "fresh_now"
[[tests.inputs]]
insert_at = "current_time_gate"
type = "vrl"
source = ". = {\"capstone_norm\": {\"schema_version\": \"vector-1\", \"pipeline\": \"vector\", \"sensor\": \"groot-sec\", \"source\": \"suricata\", \"correlation_dedupe_key\": \"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\", \"correlation_eligible\": true, \"correlation_time_class\": \"fresh\", \"protected_asset\": false, \"quality_flags\": []}}\n.capstone_norm.event_time_kst = format_timestamp!(now(), format: \"%+\")"
[[tests.outputs]]
extract_from = "current_time_gate"
[[tests.outputs.conditions]]
type = "vrl"
source = "assert_eq!(.audit.allowed_at_this_transform, true)\nassert_eq!(.audit.operational_promotion_authorized, false)"

