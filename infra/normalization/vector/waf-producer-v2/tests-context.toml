# Isolated native unit tests. This topology must never be a production service.
[sources.test_input]
type = "demo_logs"
format = "json"
count = 0
[transforms.guard]
type = "remap"
inputs = ["test_input"]
file = "../transforms/waf_json_guard.vrl"
drop_on_error = true
drop_on_abort = true
reroute_dropped = true
[transforms.context]
type = "remap"
inputs = ["guard"]
file = "audit-context.vrl"
drop_on_error = true
drop_on_abort = true
reroute_dropped = true
[sinks.discard]
type = "blackhole"
inputs = ["context", "context.dropped", "guard.dropped"]

[[tests]]
name = "context_kst"
[[tests.inputs]]
insert_at = "guard"
type = "vrl"
source = '''
. = {"message": "{\"transaction\":{\"unique_id\":\"v2:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb:dddddddddddddddddddddddddddddddd:1791946800.123:2026-10-14T12:00:00+09:00\",\"time_stamp\":\"Wed Oct 14 12:00:00 2026\",\"client_ip\":\"198.18.0.1\",\"host_ip\":\"10.200.10.2\",\"client_port\":42000,\"host_port\":8080,\"request\":{\"method\":\"GET\"},\"response\":{\"http_code\":200,\"headers\":{\"Server\":\"nginx\"}},\"producer\":{\"secrules_engine\":\"DetectionOnly\"},\"messages\":[{\"details\":{\"ruleId\":\"9900992\",\"severity\":\"5\"}}]}}", "source_file": "/synthetic/audit.log"}
'''
[[tests.outputs]]
extract_from = "context"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
assert_eq!(.capstone_norm.producer_format_version, "2")
assert_eq!(.capstone_norm.event_time_kst, "2026-10-14T12:00:00.123000+09:00")
assert_eq!(.capstone_norm.time_basis, "nginx_modsecurity_context_creation")
assert_eq!(.capstone_norm.time_status, "trusted_context_creation")
assert_eq!(.capstone_norm.identity_scope, "deployment_binding_request_id")
assert_eq!(.capstone_norm.source_replay_deduplicated, false)
assert!(is_null(.capstone_norm.time_evidence_sha256))
'''

