# Data only: no quotes, variable expansion, command substitution, or shell code.
# Copy to deployment/site.local.conf (Git-ignored), then change every address.
SECURITY_HOST=192.0.2.10
SIEM_HOST=192.0.2.20
SERVICE_HOST=192.0.2.30
SSH_USER=ubuntu
SSH_PORT=22
# Empty uses existing ssh-agent/default keys. Use an absolute path when specified.
SSH_IDENTITY=
# This must contain host keys verified independently through the server console.
SSH_KNOWN_HOSTS=/home/operator/.ssh/known_hosts
MONITOR_INTERFACE=auto
WEB_BACKEND_PORT=80
WAF_PORT=8080
# Optional lowercase DNS name. Prepare DNS/hosts -> SECURITY_HOST manually.
# HTTP only; blank keeps http://SECURITY_HOST:WAF_PORT/log4shell/.
LOG4SHELL_HOSTNAME=
# Empty/omitted builds the Spring Boot app on the service server from the
# transferred source and prepared local image dependencies; never on the Mac.
# Optional override: a reviewed /opt/...jar already on the service server.
LOG4SHELL_APP_JAR=
LLM_BASE_URL=http://192.0.2.40:11434/v1
LLM_MODEL=qwen3.6:35b
# Optional preloaded Log4Shell image override. Empty/omitted uses the service
# role's reviewed official digest; prepare that image manually before --check.
# LOG4SHELL_IMAGE=registry.example.org/labs/log4shell@sha256:REPLACE_WITH_REVIEWED_DIGEST
