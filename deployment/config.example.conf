# Data only: no quotes, variable expansion, command substitution, or shell code.
# Copy to deployment/site.local.conf (Git-ignored), then change every address.
SECURITY_HOST=192.0.2.10
SIEM_HOST=192.0.2.20
SERVICE_HOST=192.0.2.30
SSH_USER=ubuntu
SSH_PORT=22
# Empty uses existing ssh-agent/default keys. Use an absolute path when specified.
SSH_IDENTITY=
# This must contain host keys verified independently through the server console.
SSH_KNOWN_HOSTS=/home/operator/.ssh/known_hosts
MONITOR_INTERFACE=auto
WEB_BACKEND_PORT=80
WAF_PORT=8080
# Prepare DNS/hosts -> SECURITY_HOST and a certificate valid for this hostname.
LAB_PUBLIC_ORIGIN=https://lab.example.org
LAB_HTTPS_PORT=443
# Only these internal/VPN source networks can access the lab TLS endpoint.
LAB_ALLOWED_CIDRS=192.168.10.0/24
# Dedicated, unused Docker /29. Must not overlap host routes or allowed clients.
LAB_PROXY_SUBNET=172.30.247.0/29
LAB_GATEWAY_PORT=18091
# Paths below are on target servers, never uploaded from the controller.
# Service server:
LAB_WHEEL_DIR=/opt/capstone-prereqs/wheels
LAB_MANIFEST=/opt/capstone-prereqs/cve_list.json
LAB_SUDO_BUNDLE=/opt/capstone-prereqs/sudo
# Security server (root-owned; key mode0600):
LAB_TLS_CERT=/opt/capstone-prereqs/lab-tls.crt
LAB_TLS_KEY=/opt/capstone-prereqs/lab-tls.key
# Lab exemption key is streamed from SIEM siem.json indexer_password (admin).
# No LAB_ADMIN_KEY setting/value belongs in this file.
LLM_BASE_URL=http://192.0.2.40:11434/v1
LLM_MODEL=qwen3.6:35b
# Each host also requires /opt/capstone-prereqs/artifacts.json.
# It lists reviewed local .deb archives and docker-save .tar images; deploy.sh
# installs/loads them automatically, without downloads. Empty arrays mean that
# dependencies are already installed; role checks still enforce their versions.
# LOG4SHELL_IMAGE / LOG4SHELL_APP_JAR / LOG4SHELL_HOSTNAME are retired.
# Optional image overrides for already prepared artifacts:
# WAF_IMAGE=owasp/modsecurity-crs:nginx
# SURICATA_IMAGE=jasonish/suricata:8.0.2
# DVWA_IMAGE=ghcr.io/digininja/dvwa:latest
# MARIADB_IMAGE=mariadb:10
